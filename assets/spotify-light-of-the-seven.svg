<svg width="560" height="150" viewBox="0 0 560 150" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Light of the Seven</title>
  <desc id="desc">A Spotify-style card for Light of the Seven by Ramin Djawadi.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="560" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#241B5A"/>
      <stop offset="0.45" stop-color="#102A47"/>
      <stop offset="1" stop-color="#071627"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(92 28) rotate(133) scale(118 82)">
      <stop stop-color="#8B5CF6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="coverClip">
      <rect x="20" y="20" width="110" height="110" rx="8"/>
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="560" height="150" rx="10" fill="url(#bg)"/>
  <rect width="560" height="150" rx="10" fill="url(#glow)"/>

  <g filter="url(#shadow)" clip-path="url(#coverClip)">
    <image x="20" y="20" width="110" height="110" preserveAspectRatio="xMidYMid slice" href="light-of-the-seven-cover.jpg"/>
  </g>

  <text x="154" y="55" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">Light of the Seven</text>
  <rect x="154" y="68" width="64" height="24" rx="4" fill="#2563EB"/>
  <text x="186" y="85" text-anchor="middle" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="800">Preview</text>
  <text x="228" y="85" fill="#CBD5E1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">Ramin Djawadi</text>

  <circle cx="167" cy="112" r="12" stroke="#FFFFFF" stroke-width="2.5"/>
  <path d="M167 105V119M160 112H174" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <text x="194" y="117" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="800">Save on Spotify</text>

  <circle cx="526" cy="27" r="13" fill="#FFFFFF"/>
  <path d="M518 24C523 21.5 529 21.8 534 24.2M519 28C523.2 26.2 528.3 26.4 532.5 28.2M521 32C524.2 30.9 527.6 31 530.5 32.2" stroke="#0B2440" stroke-width="2" stroke-linecap="round"/>
  <circle cx="526" cy="112" r="18" fill="#FFFFFF"/>
  <path d="M521 103L535 112L521 121V103Z" fill="#0B2440"/>
  <circle cx="482" cy="113" r="2" fill="#FFFFFF"/>
  <circle cx="492" cy="113" r="2" fill="#FFFFFF"/>
  <circle cx="502" cy="113" r="2" fill="#FFFFFF"/>
</svg>
