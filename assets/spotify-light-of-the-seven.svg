<svg width="640" height="170" viewBox="0 0 640 170" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Light of the Seven</title>
  <desc id="desc">A Spotify-style card for Light of the Seven by Ramin Djawadi.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="640" y2="170" gradientUnits="userSpaceOnUse">
      <stop stop-color="#081C33"/>
      <stop offset="0.55" stop-color="#102A47"/>
      <stop offset="1" stop-color="#071627"/>
    </linearGradient>
    <linearGradient id="cover" x1="34" y1="25" x2="142" y2="133" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E3A8A"/>
      <stop offset="0.5" stop-color="#0F766E"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(112 46) rotate(133) scale(119 98)">
      <stop stop-color="#8B5CF6" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="640" height="170" rx="14" fill="url(#bg)"/>
  <rect width="640" height="170" rx="14" fill="url(#glow)"/>

  <g filter="url(#shadow)">
    <rect x="28" y="25" width="120" height="120" rx="8" fill="url(#cover)"/>
    <rect x="40" y="37" width="96" height="96" rx="4" fill="#071627" opacity="0.28"/>
    <path d="M52 59H124" stroke="#E5E7EB" stroke-opacity="0.36" stroke-width="1.5"/>
    <path d="M52 82H124" stroke="#E5E7EB" stroke-opacity="0.25" stroke-width="1.5"/>
    <path d="M52 105H124" stroke="#E5E7EB" stroke-opacity="0.18" stroke-width="1.5"/>
    <text x="88" y="86" text-anchor="middle" fill="#F8FAFC" font-family="Georgia, serif" font-size="42" font-weight="700" letter-spacing="2">VII</text>
    <text x="88" y="116" text-anchor="middle" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="12" letter-spacing="3">LIGHT</text>
  </g>

  <text x="174" y="62" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">Light of the Seven</text>
  <rect x="174" y="76" width="64" height="24" rx="4" fill="#2563EB"/>
  <text x="206" y="93" text-anchor="middle" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="800">Preview</text>
  <text x="248" y="93" fill="#CBD5E1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">Ramin Djawadi</text>

  <circle cx="187" cy="121" r="12" stroke="#FFFFFF" stroke-width="2.5"/>
  <path d="M187 114V128M180 121H194" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <text x="214" y="126" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="800">Save on Spotify</text>

  <circle cx="604" cy="30" r="13" fill="#FFFFFF"/>
  <path d="M596 27C601 24.5 607 24.8 612 27.2M597 31C601.2 29.2 606.3 29.4 610.5 31.2M599 35C602.2 33.9 605.6 34 608.5 35.2" stroke="#0B2440" stroke-width="2" stroke-linecap="round"/>
  <circle cx="595" cy="127" r="18" fill="#FFFFFF"/>
  <path d="M590 118L604 127L590 136V118Z" fill="#0B2440"/>
  <circle cx="542" cy="128" r="2" fill="#FFFFFF"/>
  <circle cx="552" cy="128" r="2" fill="#FFFFFF"/>
  <circle cx="562" cy="128" r="2" fill="#FFFFFF"/>
</svg>
